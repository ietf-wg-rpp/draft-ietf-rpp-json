name: JSON consistency

on:
  push:
    paths:
      - "src/draft-ietf-rpp-json.md"
      - ".scripts/check_json_consistency.py"
      - ".scripts/requirements.txt"
      - ".work/draft-ietf-rpp-data-objects.yaml"
      - ".github/workflows/json-consistency.yml"
  pull_request:
    paths:
      - "src/draft-ietf-rpp-json.md"
      - ".scripts/check_json_consistency.py"
      - ".scripts/requirements.txt"
      - ".work/draft-ietf-rpp-data-objects.yaml"
      - ".github/workflows/json-consistency.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r .scripts/requirements.txt

      - name: Check JSON schemas and examples
        env:
          PYTHONUNBUFFERED: "1"
        run: python .scripts/check_json_consistency.py -q src/draft-ietf-rpp-json.md 2>&1
